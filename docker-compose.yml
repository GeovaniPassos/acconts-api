services:
  postgres:
    image: postgres:16
    container_name: postgres_bd
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5432 já é utilizada pelo PostgreSQL local; dentro da rede Docker o
      # serviço continua disponível na porta padrão 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - minha-rede-interna

  api:
    build: .
    container_name: accounts-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - minha-rede-interna

volumes:
  pgdata:

networks:
  minha-rede-interna:
    driver: bridge
