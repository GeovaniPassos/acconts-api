services:
  postgres:
    image: postgres:16
    container_name: postgres_bd
    environment:
      POSTGRES_DB: accountsDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

